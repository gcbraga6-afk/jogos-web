function placeholderSheet(kind,spec){
 const canvas=document.createElement('canvas');
 canvas.width=SPRITE_FRAME*spec.frames;canvas.height=SPRITE_FRAME;
 const ctx=canvas.getContext('2d');
 const [color,light,shade]=spritePalettes[kind];
 const back=kind==='soldier'||kind==='commander';
 const wide=kind==='armor'||kind==='boss';
 function shape(points,fill,outline=true){
  ctx.beginPath();ctx.moveTo(...points[0]);
  for(const point of points.slice(1))ctx.lineTo(...point);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(outline)ctx.stroke();
 }
 function oval(x,y,w,h,fill,outline=true){
  ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);
  ctx.fillStyle=fill;ctx.fill();
  if(outline)ctx.stroke();
 }
 for(let frame=0;frame<spec.frames;frame++){
  const action=frame>=4,alt=frame%2===0?1:-1;
  const step=action?0:[-8,0,8,0][frame%4],bob=action?0:Math.abs(step)*.36;
  const shoulder=wide?31:kind==='runner'?18:23;
  ctx.save();ctx.translate(frame*SPRITE_FRAME+64,0);
  ctx.lineJoin='round';ctx.strokeStyle='#182132';ctx.lineWidth=3.8;
  for(const side of [-1,1]){
   const x=side*(wide?14:11),dy=side*step*.38;
   shape([[x-8,88-bob],[x+8,88-bob],[x+7+step*.42,112+dy],[x-7+step*.42,113+dy]],shade);
   oval(x+step*.42,115+Math.min(0,dy),9,4,'#263043');
  }
  shape([[-shoulder+1,62-bob],[shoulder-1,62-bob],[shoulder+5,75-bob],[shoulder-4,93-bob],[-shoulder+4,93-bob],[-shoulder-5,75-bob]],color);
  shape([[-shoulder+4,75-bob],[shoulder-5,73-bob],[shoulder-5,82-bob],[-shoulder+4,86-bob]],shade,false);
  for(const side of [-1,1]){
   const swing=action&&kind==='boss'?-18:side*step*.46;
   oval(side*(shoulder+3),72-bob+swing*.65,wide?10:8,wide?13:11,color);
   oval(side*(shoulder+6),84-bob+swing,wide?8:6,wide?9:7,shade);
  }
  const head=wide?26:kind==='runner'?19:22;
  oval(0,48-bob,head,22,back?shade:color);
  shape([[-head,47-bob],[-head+5,33-bob],[-11,25-bob],[11,25-bob],[head-4,34-bob],[head+1,47-bob],[12,51-bob],[-12,51-bob]],back?light:(wide?shade:light));
  if(back){
   shape([[-13,58-bob],[13,58-bob],[16,79-bob],[10,88-bob],[-10,88-bob],[-16,79-bob]],shade);
   shape([[-8,69-bob],[9,69-bob],[9,73-bob],[-8,73-bob]],kind==='commander'?'#ffcc68':light,false);
   const lift=action?9+alt*2:0;
   shape([[21,82-bob],[28,80-bob],[32,54-lift-bob],[25,53-lift-bob]],'#354259');
   if(action){
    shape([[26,53-lift-bob],[22,43-lift-bob],[27,44-lift-bob],[32,34-lift-bob],[34,44-lift-bob],[41,46-lift-bob],[34,51-lift-bob]],'#ffd373',false);
    oval(31,46-lift-bob,3,5,'#fff6c7',false);
   }
  }else{
   shape([[-head+5,48-bob],[head-5,48-bob],[head-8,57-bob],[-head+8,57-bob]],'#283043',false);
   for(const side of [-1,1])oval(side*8,52-bob,4,2,kind==='boss'?'#ffdc72':'#fce5d5',false);
   if(kind==='shield'){
    shape([[-24,66-bob],[9,61-bob],[22,70-bob],[18,95-bob],[-4,106-bob],[-23,94-bob]],'#61356f');
    shape([[-13,72-bob],[10,69-bob],[15,74-bob],[11,91-bob],[-3,99-bob],[-15,89-bob]],'#ed75a9',false);
   }

    for(const side of [-1,1])shape([[side*12,64-bob],[side*29,61-bob],[side*32,72-bob],[side*18,79-bob]],light);
   }
  }
  ctx.restore();
 }
 return canvas;
}

function rollRewards(){
 const pool=rewardPool.filter(r=>r.gun!==(run.gun??'rifle')&&!(r.id==='repair'&&run.health>85));
 const weapons=pool.filter(r=>r.gun),others=pool.filter(r=>!r.gun);
 const pick=list=>list.splice(Math.floor(Math.random()*list.length),1)[0];
 return [pick(weapons),pick(others),pick(Math.random()<.5?weapons:others)??pick(others)].map(r=>r.id);
}

function audio(kind){

 const tones={mg:[210,52,.072,.115,3700],shot:[112,35,.14,.18,2300],
  bomb:[340,89,.16,.13,1240],impact:[73,29,.29,.19,1300],pop:[390,136,.061,.045,5100],
  reward:[435,930,.24,.075,0],trap:[460,112,.30,.09,960],alarm:[295,470,.52,.115,0]};

 tone.frequency.setValueAtTime(start*pitch,now);tone.frequency.exponentialRampToValueAtTime(end*pitch,now+duration);
 tone.connect(gain);gain.connect(ctx.destination);

  noise.connect(filter).connect(gain);noise.start();noise.stop(now+Math.min(duration,.38));
 }
}

  if(phase!=='wave'||event.button!==0)return;
  void enableAudio();
  drag=event.pointerId;dragX=event.clientX;dragHero=run.heroX??0;
  renderer.domElement.setPointerCapture(event.pointerId);
 };
 let drag=null,dragX=0,dragHero=0;
 renderer.domElement.onpointermove=event=>{
  if(phase!=='wave'||drag!==event.pointerId)return;
  const rect=renderer.domElement.getBoundingClientRect();
  run.heroTarget=clamp(dragHero+(event.clientX-dragX)/rect.width*Math.min(24,16*camera.aspect+8),FIELD.left,FIELD.right);
 };
 const release=event=>{if(drag===event.pointerId)drag=null;};
 renderer.domElement.onpointerup=release;renderer.domElement.onpointercancel=release;renderer.domElement.onlostpointercapture=release;
 const focusRing=new T.Mesh(new T.RingGeometry(1.5,1.85,36),new T.MeshBasicMaterial({color:0xfff27a,side:T.DoubleSide,transparent:true,opacity:.9,depthWrite:false}));
 focusRing.rotation.x=-Math.PI/2;scene.add(focusRing);
 function resize(){
  const w=world.clientWidth,h=world.clientHeight;
  if(!w||!h)return;
  const ratio=w/h;
  camera.aspect=ratio;
  camera.fov=ratio<.85?61:50;
  cameraHome.set(0,ratio<.85?20:18,ratio<.85?28:24);
  camera.updateProjectionMatrix();renderer.setSize(w,h,false);
 }
 window.addEventListener('resize',resize);resize();
 function draw(){
  const t=run.clock;
  showMap(currentMap());
  camera.position.copy(cameraHome);
  camera.position.x+=(run.heroX??0)*.25+Math.sin(performance.now()*.064)*shake;
  camera.position.y+=Math.cos(performance.now()*.076)*shake*.54;
  camera.lookAt(viewTarget);camera.updateMatrixWorld();
  for(const mesh of meshes)mesh.count=0;
  for(const node of markerNodes.values())node.seen=false;
  const heroX=run.heroX??0,heroZ=run.heroZ??BASE,pace=Math.abs(run.heroVelocity??0);
  const visibleArmy=Math.min(MAX_VISIBLE_ARMY,run.army);
  if(lastRun!==run||lastWave!==run.wave){
   recruits.length=0;lastArmy=visibleArmy;lastWave=run.wave;lastRun=run;
  }
  for(let i=lastArmy;i<visibleArmy;i++)recruits[i]=t-(i-lastArmy)*.014;
  recruits.length=Math.min(recruits.length,visibleArmy);lastArmy=visibleArmy;
  for(let i=0;i<visibleArmy;i++){
   const kind=i===0?'commander':'soldier',spec=SPRITES[kind];
   const {x,z}=formationPoint(i,visibleArmy,heroX);
   const shotAge=t-(run.soldierShotAt?.[i]??-1);
   const firing=phase==='wave'&&shotAge>=0&&shotAge<.14;
   const walk=phase==='wave'&&pace>.25;
   const frame=firing?spec.fire[Math.floor(shotAge/.07)]:
    spec.walk[walk?Math.floor(t*spec.fps+i*.61)%spec.walk.length:1];
   const recruitAge=t-(recruits[i]??-10);
   character(kind,x,z,frame,0,bounceSize(Math.max(0,recruitAge)));
  }
  for(const e of run.foes){
   const spec=SPRITES[e.type],data=enemyTypes[e.type];
   const time=t*spec.fps*(data.speed/4.2)+e.id*.618;
   const warning=e.type==='boss'&&e.warning>0;
   const frame=warning?spec.attack[Math.floor(t*9)%spec.attack.length]:spec.walk[Math.floor(time)%spec.walk.length];
   const feedback=e.flash>0?1:warning&&Math.floor(t*15)%2===0?-.72:0;
   character(e.type,e.x,e.z,frame,feedback,1,e.flash>0);
   if(e.type==='boss'){
    tag('e'+e.id,'COLOSSO','',e.x,spec.size[1]*.92,e.z,'boss',{meter:clamp(e.hp/e.max,0,1)});
   }
  }
  if(run.supply&&phase==='wave'){
   const x=run.supply.x;
   instance(portalBodies,0x357b56,x,.52,BASE,1.15,.74,.74);
   instance(portalGlow,0xb7fa87,x,.92,BASE,.82,.14,.64);
   tag('supply','+4 soldados','Passe por cima',x,1.26,BASE);
  }
  for(const g of run.gates){
   const info=gateAppearance(g),y=1.0+Math.sin(t*4+g.id)*.14,c=g.flash>0?0xfffefe:info.color;
   instance(portalBodies,info.bad?0x562b4a:0x1c5a53,g.x,y,g.z,1.65,1.34,.47);
   instance(portalGlow,c,g.x-.81,y,g.z,.12,1.39,.56);
   instance(portalGlow,c,g.x+.81,y,g.z,.12,1.39,.56);
   instance(portalGlow,c,g.x,y+.66,g.z,1.72,.13,.57);
   tag('g'+g.id,info.name,g.hp+' acertos',g.x,y+.9,g.z,info.bad?'bad':'');
  }
  for(const b of run.bolts){
   if(b.type==='peloton'){
    const look=GUN_LOOK[run.gun??'rifle'],yaw=Math.atan2(b.dx,b.dz);
    instance(boltMeshes,look.glow,b.x,.89,b.z,look.w*2.2,look.w*2.2,look.l*1.15,yaw);
    instance(boltMeshes,look.core,b.x,.9,b.z,look.w,look.w,look.l,yaw);
    continue;
   }
   const arc=b.type==='bomb',height=arc?.6+Math.sin(Math.PI*b.t)*3.7:.68;
   const width=arc?.53:b.type==='shot'?.22:.31;
   const yaw=arc?0:Math.atan2(b.dx,b.dz);
   const length=arc?.58:b.type==='shot'?.63:1.13;
   const outline=b.type==='peloton'?0xeb650f:b.type==='mg'?0x138fbd:0xb640eb;
   instance(boltMeshes,outline,b.x,height,b.z,width*1.46,width*1.46,length*1.18,yaw);
   instance(boltMeshes,b.color,b.x,height+.05,b.z,width,width,length,yaw);
   instance(boltMeshes,0xfff6d8,b.x,height+.10,b.z,width*.45,width*.45,length*.59,yaw);
  }
  for(const p of debris){
   if(p.ring){
    const scale=3.9*(1-p.life/.5)+.5;
    instance(rings,p.color,p.x,.09,p.z,scale,1,scale);
    continue;
   }
   const size=p.flash?.69:Math.max(.08,p.life*.47);
   instance(p.flash?boltMeshes:p.cube?chips:dust,p.color,p.x,p.y,p.z,size,size,size,p.life*9);
  }
  let index=0;
  for(const n of numbers)tag('d'+index++,n.label,'',n.x,1.5+(1-n.life/.55)*2.2,n.z,'damage',{opacity:Math.min(1,n.life*5)});
  if(phase!=='menu')tag('army',run.army+' soldados',run.boost>0?'Cadência ×2 · '+Math.ceil(run.boost)+'s':'',
   heroX,2.72,heroZ,'army',{scale:1+.3*armyPunch/.2});
  gunBadge.hidden=phase==='menu';
  if(!gunBadge.hidden){
   const gun=run.gun??'rifle';
   if(badgeGun!==gun){badgeGun=gun;gunBadge.innerHTML=icon(gun)+'<span>'+GUNS[gun].name+'</span>';}
   position(gunBadge,heroX+3.3,1.2,heroZ);
  }
  for(const reward of gateRewards){
   const progress=1-(reward.life/.65)**2;
   tag('reward'+reward.id,'+'+reward.value+'!','',reward.gx+(heroX-reward.gx)*progress,
    2.1+Math.sin(progress*Math.PI)*2.6,reward.gz+(heroZ-reward.gz)*progress,'army',{scale:1.35});
  }
  slots.forEach((s,i)=>{
   const tower=run.slots[i],visual=stationMeshes[i],btn=slotButtons[i];
   btn.hidden=!['prep','wave'].includes(phase)||tower?.level===3&&phase==='wave';
   btn.textContent=tower?(phase==='wave'?'▲':'Nível '+tower.level):(phase==='wave'?'＋':'Construir');
   btn.classList.toggle('mini',phase==='wave');btn.style.zIndex=1;
   if(!btn.hidden)position(btn,s.x,1.15,s.z);
   visual.turret.visible=!!tower;
   if(tower){
    visual.turret.rotation.y=-(tower.yaw??0);
    visual.body.material=material(towers[tower.type].color);
    visual.head.scale.x=tower.type==='shot'?.53:tower.type==='bomb'?.43:.27;
    visual.trim.scale.x=visual.head.scale.x+.06;
    visual.turret.scale.setScalar(1+(tower.level-1)*.15);
   }
  });
  for(const [id,node] of markerNodes)if(!node.seen){node.remove();markerNodes.delete(id);}
  focusRing.visible=phase==='wave'&&!!run.focus;
  if(run.focus){
   const pulse=1+.12*Math.sin(t*14);
   focusRing.position.set(run.focus.x,.12,run.focus.z);
   focusRing.scale.setScalar((run.focus.gate?.8:1.4)*pulse);
   focusRing.material.color.set(run.focus.gate?0x5dffb0:0xfff27a);
  }
  const boss=run.foes.find(e=>e.type==='boss'&&e.warning>0);
  warning.visible=!!boss;if(boss)warning.position.set(boss.attackX??0,.53,boss.attackZ??BASE);warning.material.opacity=.5+.32*Math.sin(t*22);
  for(const batch of Object.values(spriteBatches)){
   if(!batch.mesh.count)continue;
   batch.frame.needsUpdate=true;batch.feedback.needsUpdate=true;
  }
  for(const mesh of meshes){
   if(!mesh.count)continue;
   mesh.instanceMatrix.needsUpdate=true;
   if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  }
  renderer.render(scene,camera);
 }
 return {draw};
}

// Só para testes automáticos (abrir com #teste).
if(location.hash==='#teste')window.__jogo={get run(){return run},set speed(v){testSpeed=v}};
let testSpeed=1;
let previous=0,accumulator=0,statsFrame=0;
function animation(now){
 const dt=previous?Math.min(.06,(now-previous)/1000):0;
 previous=now;
 if(phase==='wave'){
  if(freeze>0)freeze=Math.max(0,freeze-dt);
  else{
   accumulator+=dt*testSpeed*(slow>0?.39:1);
   while(accumulator>=STEP&&phase==='wave'){
    updateGame(STEP);accumulator-=STEP;
    if(freeze>0)break;
   }
  }
  slow=Math.max(0,slow-dt);
  savedClock+=dt;
  if(savedClock>2){savedClock=0;snapshot();}
 }else accumulator=0;
 if(phase!=='paused'){
  updateFx(dt);noteLeft=Math.max(0,noteLeft-dt);shake*=Math.exp(-dt*9);red=Math.max(0,red-dt);
 }
 statsFrame+=dt;
 if(statsFrame>.10){
  statsFrame=0;
  $('life').textContent='Base '+run.health+'%';
  $('hp').firstElementChild.style.width=run.health+'%';
  $('stage').textContent='Onda '+(run.wave+1)+' / '+TOTAL;
  const cooldown=Math.ceil(run.pulse??0);
  $('pulse').textContent=cooldown?'Pulso · '+cooldown+'s':'Pulso';
  $('pulse').disabled=cooldown>0;
  $('callout').hidden=noteLeft<=0||phase==='menu'||phase==='paused';
  $('callout').textContent=note;
 }
 $('game').style.setProperty('--damage',String(red*.9));
 rendering.draw();
 requestAnimationFrame(animation);
}
async function launch(){
 try{
  const T=await import('https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js');
  rendering=createScene(T);
  refresh();
  requestAnimationFrame(animation);
 }catch(error){
  console.error(error);
  panel('Não foi possível abrir o campo 3D','Abra em um navegador com WebGL 2 e confira sua conexão com a internet.',
   [button('Tentar novamente',()=>location.reload(),{primary:true})]);
 }
}
void launch();
