<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172528">
<title>Esquadrão da Horda · Última Barragem</title>
<style>
:root{font:15px system-ui,sans-serif;color:#f5f2de;color-scheme:dark;background:#172528;--ink:#132725;--mint:#cafb83;--dim:#bbc9b8}
*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:9px;padding:.75rem 1rem;background:#304944;color:white;min-height:44px}button:disabled{cursor:default;opacity:.45}button:active:enabled{transform:scale(.96)}button:focus-visible{outline:3px solid #fff}small{display:block;color:var(--dim)}[hidden]{display:none!important}
#game,#world,#tags{position:fixed;inset:0}#game::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 72px #ff2c55;opacity:var(--damage,0)}#world canvas{display:block;width:100%;height:100%;touch-action:none}#tags{pointer-events:none;overflow:hidden}#top{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),680px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #d4efc833;border-radius:12px;background:#132725f0;box-shadow:0 8px 24px #13272560}
#hp{width:clamp(65px,19vw,145px);height:6px;margin-top:5px;background:#596659;border-radius:4px;overflow:hidden}#hp i{display:block;height:100%;background:var(--mint)}
#sound,#pause{padding:.5rem .7rem}#stage{font-size:.87rem;letter-spacing:.03em;text-align:center}#panel{position:absolute;z-index:3;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 20px),560px);background:#142824f5;border:1px solid #91ae9375;border-radius:16px;padding:14px;box-shadow:0 12px 35px #0f262c80}#panel[data-phase=menu],#panel[data-phase=won],#panel[data-phase=lost],#panel[data-phase=paused]{bottom:50%;transform:translate(-50%,50%);padding:clamp(16px,4vw,32px)}
#panel h1,#panel h2{margin:3px 0 8px;line-height:.99;letter-spacing:-.04em}#panel h1{font-size:clamp(2.6rem,10vw,5rem);max-width:7ch}#panel h2{font-size:clamp(1.25rem,4vw,1.8rem)}#panel p{margin:.4rem 0 .8rem;color:#c3d0c0;line-height:1.35}
.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.17em;color:#c3ee90}.primary{background:var(--mint);color:var(--ink)}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.menu button{font-size:.83rem;padding:.45rem .5rem}.menu small{margin-top:3px;font-size:.72rem}.slot,.tag{position:absolute;left:0;top:0;white-space:nowrap}.slot{pointer-events:auto;min-height:32px;padding:5px 8px;border:1px solid #b5f4dc90;border-radius:6px;background:#173d3ae8;font-size:.74rem}.tag{font-weight:900;font-size:clamp(.78rem,2.7vw,1.12rem);text-align:center;padding:.12rem .45rem;border-radius:6px;background:#1a3c2eeb;color:#c9ff90;box-shadow:0 1px 6px #13272555}.tag.bad{background:#65294cef;color:#ffd4e0}.tag small{font-size:.69rem;line-height:1.1;color:inherit}.tag.damage{color:#fff5cb;background:transparent;text-shadow:0 2px 3px #451c12;box-shadow:none}.tag.army{color:#e4fbff;background:#114b6cee;font-size:1.13rem}.tag.boss{background:#632b38;color:#ffeabe}
#callout{position:absolute;z-index:1;top:16%;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;font-weight:900;font-size:clamp(1.1rem,4vw,2.25rem);text-shadow:0 2px 6px #172822;background:#162c25d9;border-radius:9px;padding:.25rem .8rem;max-width:92%;width:max-content}
#pulse{position:absolute;z-index:2;right:max(13px,env(safe-area-inset-right));bottom:max(13px,env(safe-area-inset-bottom));background:#cafa82;color:#203120;min-width:93px}#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;background:#172d28dc;padding:6px 10px;border-radius:8px;pointer-events:none;max-width:calc(100% - 124px);width:max-content;font-size:.83rem;left:13px;transform:none}
@media(max-height:480px){#panel{padding:8px}#panel p{margin:4px 0}#panel[data-phase=menu]{padding:14px}#panel h1{font-size:2.5rem}}
</style>
</head>
<body>
<main id="game">
 <div id="world" aria-label="Campo de batalha 3D"></div><div id="tags"></div>
 <header id="top" hidden>
  <div><strong id="life">Base 100%</strong><div id="hp"><i></i></div></div><strong id="stage"></strong>
  <div class="row"><button id="sound" aria-label="Silenciar som" aria-pressed="false">Som</button><button id="pause">Pausa</button></div>
 </header>
 <div id="callout" hidden></div><div id="hint" hidden>Arraste para mover e mirar. No teclado, A/D ou setas movem e Espaço dispara o pulso.</div><button id="pulse" hidden aria-label="Disparar pulso na mira">Pulso</button>
 <section id="panel" data-phase="menu"><p>Carregando o campo 3D…</p></section>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const random=(lo,hi)=>lo+Math.random()*(hi-lo);
const distance=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const BASE=11, FRONT=-29, ENTRY=-21, TOTAL=3, STEP=1/60;
const slots=[{x:-9,z:-10},{x:0,z:-3},{x:9,z:-10},{x:-7,z:5},{x:7,z:5}];
const enemyTypes={
 runner:{name:'Corredores',hp:19,speed:5.8,r:.48,scale:.85,color:0xff4d40,breach:3},
 swarm:{name:'Enxame',hp:29,speed:4.2,r:.53,scale:1,color:0xf68139,breach:4},
 armor:{name:'Blindados',hp:145,speed:2.35,r:.84,scale:1.42,color:0xb92d54,breach:14},
 shield:{name:'Escudeiros',hp:88,speed:2.8,r:.74,scale:1.22,color:0xe84a76,breach:9},
 boss:{name:'Colosso',hp:780,speed:1.5,r:1.42,scale:2.35,color:0xe5303f,breach:45}
};
const towers={
 mg:{name:'Metralhadora',cost:5,color:0x4bd3ee,range:11,detail:'Fogo concentrado'},
 shot:{name:'Escopeta',cost:5,color:0xfdb266,range:7.4,detail:'Leque e empurrão'},
 bomb:{name:'Granadeira',cost:7,color:0xb99af9,range:14,detail:'Explosão em área'}
};
const gates={
 five:{name:'+5 soldados',hp:5,color:0x82f0a4},
 ten:{name:'+10 soldados',hp:11,color:0xc7f884},
 double:{name:'×2 soldados',hp:19,color:0xc7f884},
 rapid:{name:'×2 cadência',hp:10,color:0x80f2dc},
 free:{name:'Torre grátis',hp:14,color:0x84eafa},
 minus:{name:'−3 soldados',hp:3,color:0xff5383,bad:true},
 half:{name:'÷2 soldados',hp:4,color:0xc56bf2,bad:true}
};
// tipo, quantidade, caminho (0 = oeste, 1 = leste), entrada, intervalo
const waves=[
 {preview:'Oeste · corredores. Leste · enxame.',groups:[
  ['runner',11,0,0,.24],['swarm',10,1,1.95,.38],['runner',9,1,9.3,.36],['swarm',12,0,12.1,.39]],
  offers:[['five',0,.44],['ten',1,.44],['rapid',1,9.2],['minus',0,9.2]]},
 {preview:'Oeste · escudeiros. Leste · blindados.',groups:[
  ['shield',4,0,.9,.86],['swarm',20,0,1.8,.27],['runner',17,1,3.8,.31],['armor',4,1,7.9,.85],['runner',13,0,11.4,.34]],
  offers:[['half',0,2.2],['ten',1,2.2],['free',0,10.1],['rapid',1,10.1]]},
 {preview:'Ataque nos dois acessos. O Colosso vem pelo leste.',groups:[
  ['runner',18,0,.7,.23],['swarm',22,1,2.05,.26],['armor',5,0,4.9,.66],['shield',6,1,8.7,.66],
  ['boss',1,1,12.4,1],['runner',15,0,15.8,.32],['runner',12,1,18.4,.37]],
  offers:[['double',0,2.4],['half',1,2.4],['ten',1,13],['rapid',0,13]]}
];
const saveKey='horda-barragem-1';
function saved(){
 try{
  const value=JSON.parse(localStorage.getItem(saveKey));
  if(value?.version===1)return value;
 }catch{}
 return {version:1,run:null,victories:0,muted:false};
}
const profile=saved();
function persist(){
 try {localStorage.setItem(saveKey,JSON.stringify(profile));}catch{}
}
function newRun(){
 return {wave:0,phase:'prep',health:100,army:8,slots:slots.map(()=>null),free:0,aim:{x:0,z:-8},
  heroX:0,heroTarget:0,recoil:0,foes:[],gates:[],bolts:[],schedule:[],cursor:0,clock:0,gunClock:0,boost:0,pulse:0,power:1,serial:0,kills:0};
}
let run=profile.run||newRun(), phase='menu', activeSlot=-1, soundSystem=null;
const movementKeys=new Set();
let note='',noteLeft=0,shake=0,freeze=0,slow=0, red=0,rendering=null, savedClock=0;
const debris=[],numbers=[];
function signal(text,time=1.6){note=text;noteLeft=time;}
function snapshot(){profile.run=run;persist();}
function begin(){
 const plan=waves[run.wave];
 const queue=plan.groups.flatMap(([type,count,route,start,every])=>Array.from({length:count},(_,i)=>({
  time:Math.max(0,start+i*every+random(-.13,.13)),type,
  route:type!=='boss'&&i%8===7?1-route:route,offset:random(-1,1)})));
 queue.push(...plan.offers.map(([offer,route,time])=>({offer,route,time})));
 run.schedule=queue.sort((a,b)=>a.time-b.time);
 Object.assign(run,{phase:'wave',clock:0,gunClock:0,cursor:0,boost:0,bolts:[],foes:[],gates:[],supply:null,supplySent:false});
 phase='wave';activeSlot=-1;signal('ONDA '+(run.wave+1),1.4);snapshot();refresh();
}
function routeX(route,z){
 return (route===0?-1:1)*(4.15+.95*Math.sin((z+29)*.145)+.38*Math.sin(z*.34));
}
function spawn(event){
 if(event.offer){
  const data=gates[event.offer];
  run.gates.push({id:++run.serial,type:event.offer,x:routeX(event.route,ENTRY)+ (event.route===0?-1:1)*1.65,
   z:ENTRY,hp:data.hp,max:data.hp,flash:0});
  return;
 }
 const data=enemyTypes[event.type];
 const hp=Math.round(data.hp*(1+run.wave*.07));
 run.foes.push({id:++run.serial,type:event.type,route:event.route,x:routeX(event.route,ENTRY)+event.offset,
  offset:event.offset,z:ENTRY+(run.wave===0&&event.time<1.25?4:0),hp,max:hp,flash:0,force:0,nextAttack:3.8,warning:0});
 if(event.type==='boss'){signal('COLOSSO NA BARRAGEM',2);shake=.42;audio('alarm');}
}
function applyGate(g){
 const before=run.army;
 switch(g.type){
  case 'five':run.army+=5;break;
  case 'ten':run.army+=10;break;
  case 'double':run.army*=2;break;
  case 'minus':run.army-=3;break;
  case 'half':run.army=Math.floor(run.army/2);break;
  case 'rapid':run.boost=10;break;
  case 'free':run.free++;break;
 }
 run.army=clamp(run.army,1,120);
 const delta=run.army-before;
 signal(delta>0?'+'+delta+' SOLDADOS':gates[g.type].name.toUpperCase(),1.25);
 burst(g.x,g.z,gates[g.type].color,16);audio(gates[g.type].bad?'trap':'reward');shake=Math.max(shake,.17);
}
function installation(type){
 if(phase!=='prep'||activeSlot<0)return;
 const current=run.slots[activeSlot],info=towers[type];
 if(!info||(current&&current.type!==type)||current?.level>=3)return;
 const cost=current?3+current.level:run.free?0:info.cost;
 if(run.army<=cost)return;
 if(!current&&run.free)run.free--;
 run.army-=cost;
 run.slots[activeSlot]=current?{...current,level:current.level+1}:{type,level:1,cd:0,heat:0};
 audio('reward');activeSlot=-1;snapshot();refresh();
}
function damage(enemy,amount,source='mg'){
 if(enemy.hp<=0)return;
 if(enemy.type==='shield'&&source!=='bomb')amount*=.46;
 const value=Math.round(amount);
 enemy.hp-=value;enemy.flash=.095;
 if(enemy.type==='boss'&&enemy.warning>0){
  enemy.stagger=(enemy.stagger??0)+value;
  if(enemy.stagger>=110){
   enemy.warning=0;enemy.nextAttack=5.6;
   signal('ATAQUE INTERROMPIDO',1);burst(enemy.x,enemy.z,0xffcf7b,12);
  }
 }
 if(source==='shot'&&enemyTypes[enemy.type].scale<1.3)enemy.force=3.3;
 if(numbers.length<38)numbers.push({x:enemy.x,z:enemy.z,life:.55,label:String(value),strong:value>=40});
 if(enemy.hp>0)return;
 run.kills++;
 burst(enemy.x,enemy.z,enemyTypes[enemy.type].color,enemy.type==='boss'?40:enemy.type==='armor'?13:6);
 if(enemy.type==='boss'||enemy.type==='armor'){
  freeze=enemy.type==='boss'?.065:.034;shake=enemy.type==='boss'?.65:.27;
  if(enemy.type==='boss')slow=.75;
  audio('impact');
 }else audio('pop');
}
function breach(amount){
 run.health=Math.max(0,run.health-amount);red=.45;shake=Math.max(shake,.38);audio('impact');
}
function fire(x,z,target,type,amount,spread=0,pellets=1){
 const yaw=Math.atan2(target.x-x,z-target.z);
 const color=type==='bomb'?0xd9a9ff:type==='shot'?0xffb24f:type==='peloton'?0xffe375:0x73faff;
 if(type==='bomb'){
  run.bolts.push({type,x,z,startX:x,startZ:z,targetX:target.x,targetZ:target.z,life:.67,t:0,amount,color});
 }else{
  for(let i=0;i<pellets;i++){
   const angle=yaw+(i-(pellets-1)/2)*spread;
   const speed=type==='shot'?39:59;
   run.bolts.push({type,x:x+Math.sin(angle)*.5,z:z-Math.cos(angle)*.5,
    dx:Math.sin(angle)*speed,dz:-Math.cos(angle)*speed,life:type==='shot'?.23:.81,amount,color});
  }
 }
 debris.push({x,z,y:.9,vx:0,vz:0,vy:0,life:.07,color,flash:true});
 audio(type==='peloton'?'mg':type);
}
function advanceBolts(dt){
 const keep=[];
 for(const b of run.bolts){
  b.life-=dt;
  if(b.type==='bomb'){
   b.t=clamp(b.t+dt/.67,0,1);
   b.x=b.startX+(b.targetX-b.startX)*b.t;b.z=b.startZ+(b.targetZ-b.startZ)*b.t;
   if(b.life<=0){
    for(const e of run.foes)if(distance(b,e)<3.25)damage(e,b.amount,'bomb');
    burst(b.x,b.z,0xf9ad66,22);shake=.27;freeze=.034;audio('impact');
   }else keep.push(b);
   continue;
  }
  const nx=b.x+b.dx*dt,nz=b.z+b.dz*dt;
  const len2=(nx-b.x)**2+(nz-b.z)**2;
  let target=null,nearest=2,isGate=false;
  const test=(e,r,gate)=>{
   if(e.hp<=0)return;
   const t=clamp(((e.x-b.x)*(nx-b.x)+(e.z-b.z)*(nz-b.z))/len2,0,1);
   if(t>=nearest||Math.hypot(e.x-b.x-(nx-b.x)*t,e.z-b.z-(nz-b.z)*t)>r)return;
   nearest=t;target=e;isGate=gate;
  };
  for(const e of run.foes)test(e,enemyTypes[e.type].r+.18,false);
  if(b.type==='peloton')for(const g of run.gates)test(g,.96,true);
  if(target){
   if(isGate){
    target.hp--;target.flash=.1;
    if(!target.hp)applyGate(target);
   }else damage(target,b.amount,b.type);
  }else if(b.life>0&&nz>FRONT-3&&Math.abs(nx)<18){b.x=nx;b.z=nz;keep.push(b);}
 }
 run.bolts=keep;
}
function updateHero(dt){
 const left=movementKeys.has('KeyA')||movementKeys.has('ArrowLeft');
 const right=movementKeys.has('KeyD')||movementKeys.has('ArrowRight');
 const direction=Number(right)-Number(left);
 const before=run.heroX??0;
 const target=direction?before+direction*dt*12:(run.heroTarget??before);
 run.heroX=clamp(before+clamp(target-before,-12*dt,12*dt),-7,7);
 if(direction)run.heroTarget=run.heroX;
 run.heroVelocity=(run.heroX-before)/dt;
 run.recoil=Math.max(0,(run.recoil??0)-dt*12);
}
function updateGame(dt){
 updateHero(dt);
 run.clock+=dt;
 if(!run.supplySent&&run.clock>=5){
  run.supplySent=true;
  run.supply={x:(run.wave%2===0?-1:1)*6.1,expires:6};
  signal('REFORÇO NA SUA LINHA',1.15);
 }
 if(run.supply){
  run.supply.expires-=dt;
  if(Math.abs((run.heroX??0)-run.supply.x)<.85){
   run.army=Math.min(120,run.army+4);
   burst(run.supply.x,BASE,0x97ffb4,15);audio('reward');
   signal('+4 SOLDADOS');run.supply=null;
  }else if(run.supply.expires<=0)run.supply=null;
 }
 run.boost=Math.max(0,run.boost-dt);run.pulse=Math.max(0,(run.pulse??0)-dt);
 while(run.cursor<run.schedule.length&&run.schedule[run.cursor].time<=run.clock)spawn(run.schedule[run.cursor++]);
 for(const g of run.gates){g.z+=4.15*dt;g.flash=Math.max(0,g.flash-dt);}
 for(const e of run.foes){
  if(e.hp<=0)continue;
  const data=enemyTypes[e.type];
  e.flash=Math.max(0,e.flash-dt);e.force*=Math.exp(-dt*8);
  e.z+=(data.speed-e.force)*dt;e.x=routeX(e.route,e.z)+e.offset;
  if(e.type==='boss'){
   e.nextAttack-=dt;
   if(e.warning){
    e.warning-=dt;
    if(e.warning<=0){
     e.warning=0;e.nextAttack=5.6;
     const target=e.attackX??0;
     if(Math.abs((run.heroX??0)-target)<2.1)breach(15);
     else signal('ATAQUE ESQUIVADO',1);
     burst(target,BASE,0xff5159,16);
    }
   }else if(e.nextAttack<=0){e.warning=1.65;e.stagger=0;e.attackX=run.heroX??0;signal('DESVIE OU INTERROMPA O ATAQUE!',1.6);audio('alarm');}
  }
  if(e.z>BASE-.7){breach(data.breach);e.hp=0;}
 }
 const groupPower=1+Math.sqrt(run.army-1)*.43;
 run.gunClock-=dt;
 if(run.gunClock<=0){
  const heroX=run.heroX??0,damagePerShot=13*groupPower*run.power;
  fire(heroX,BASE,run.aim,'peloton',damagePerShot);
  if(run.army>=9)fire(heroX*.52-.78,BASE+.9,run.aim,'peloton',damagePerShot);
  if(run.army>=20)fire(heroX*.52+.78,BASE+.9,run.aim,'peloton',damagePerShot);
  run.recoil=1;
  run.gunClock=(run.boost>0?.095:.19)/Math.min(2.05,1+run.army*.012);
 }
 run.slots.forEach((tower,i)=>{
  if(!tower)return;
  tower.cd-=dt;
  if(tower.cd>0)return;
  const pos=slots[i],type=towers[tower.type];
  const targets=run.foes.filter(e=>e.hp>0&&distance(pos,e)<type.range);
  const target=targets.reduce((best,e)=>!best||e.z>best.z?e:best,null);
  if(!target){tower.heat=0;return;}
  tower.yaw=Math.atan2(target.x-pos.x,pos.z-target.z);
  const strength=1+(tower.level-1)*.44;
  if(tower.type==='mg'){
   tower.heat=tower.target===target.id?Math.min(8,tower.heat+1):0;tower.target=target.id;
   fire(pos.x,pos.z,target,'mg',12*strength);tower.cd=.24-tower.heat*.014;
  }else if(tower.type==='shot'){
   fire(pos.x,pos.z,target,'shot',16*strength,.16,5);tower.cd=.69;
  }else{
   fire(pos.x,pos.z,{x:target.x,z:target.z+1.85},'bomb',72*strength);tower.cd=1.14;
  }
 });
 advanceBolts(dt);
 run.foes=run.foes.filter(e=>e.hp>0);run.gates=run.gates.filter(g=>g.hp>0&&g.z<BASE);
 if(!run.health){
  phase=run.phase='lost';snapshot();refresh();
 }else if(run.cursor===run.schedule.length&&!run.foes.length&&!run.gates.length){
  if(run.wave===TOTAL-1){
   phase=run.phase='won';profile.victories++;audio('reward');
  }else{phase=run.phase='reward';audio('reward');}
  snapshot();refresh();
 }
}

const rewards=[
 {title:'+8 soldados',detail:'Mais tiros ou outra torre',apply:()=>{run.army=Math.min(120,run.army+8);}},
 {title:'+30% de dano',detail:'Disparos do pelotão',apply:()=>{run.power*=1.3;}},
 {title:'Reparar a base',detail:'Recupera até 30 pontos de vida',apply:()=>{run.health=Math.min(100,run.health+30);}}
];
function button(label,onClick,options={}){
 const el=document.createElement('button');
 el.textContent=label;el.onclick=onClick;el.disabled=!!options.disabled;
 if(options.primary)el.className='primary';
 if(options.detail){const sub=document.createElement('small');sub.textContent=options.detail;el.append(sub);}
 return el;
}
function panel(title,desc,actions,heading='h2'){
 const el=$('panel'),kicker=document.createElement('span'), head=document.createElement(heading), p=document.createElement('p'), row=document.createElement('div');
 el.hidden=false;el.dataset.phase=phase;
 kicker.className='eyebrow';kicker.textContent='ÚLTIMA BARRAGEM';
 head.textContent=title;p.textContent=desc;
 row.className=actions.length===3?'menu':'row';row.append(...actions);
 el.replaceChildren(kicker,head,p,row);
}
function restored(){
 phase=run.phase;activeSlot=-1;void enableAudio();refresh();
}
function startNew(){
 void enableAudio();
 run=newRun();phase='prep';activeSlot=-1;
 debris.length=0;numbers.length=0;shake=red=freeze=slow=0;noteLeft=0;
 begin();
}
function firePulse(){

  flash.scale.set(.24+recoil*.45,.30+recoil*.55,.62+recoil*.80);
  heroShadow.scale.x=1.06+.11*stride;
  const army=Math.min(49,Math.max(0,run.army-1));
  for(let i=0;i<army;i++){
   const row=Math.floor(i/10),count=Math.min(10,army-row*10);
   character(heroX*.52+(i%10-(count-1)/2)*.67,BASE+1.08+row*.61,.80,0x41afd9,yaw,t*(stride>0?17:5)+i,'ally',false);
  }
  for(const e of run.foes){
   const data=enemyTypes[e.type];
   const scale=data.scale*(e.type==='boss'?1.18:1.30);
   character(e.x,e.z,scale,data.color,Math.PI,t*(e.type==='boss'?7:14)+e.id,e.type,e.flash>0);
   if(e.type==='boss'||e.max>=70&&e.hp<e.max){
    tag('e'+e.id,e.type==='boss'?'COLOSSO':'',Math.max(0,Math.round(e.hp/e.max*100))+'%',e.x,1.43*data.scale,e.z,e.type==='boss'?'boss':'bad');
   }
  }
  if(run.supply&&phase==='wave'){
   const x=run.supply.x;
   instance(portalBodies,0x357b56,x,.52,BASE,1.15,.74,.74);
   instance(portalGlow,0xb7fa87,x,.92,BASE,.82,.14,.64);
   tag('supply','+4 soldados','Passe por cima',x,1.26,BASE);
  }
  for(const g of run.gates){
   const info=gates[g.type],y=1.0+Math.sin(t*4+g.id)*.14,c=g.flash>0?0xfffefe:info.color;
   instance(portalBodies,info.bad?0x562b4a:0x1c5a53,g.x,y,g.z,1.65,1.34,.47);
   instance(portalGlow,c,g.x-.81,y,g.z,.12,1.39,.56);
   instance(portalGlow,c,g.x+.81,y,g.z,.12,1.39,.56);
   instance(portalGlow,c,g.x,y+.66,g.z,1.72,.13,.57);
   tag('g'+g.id,info.name,g.hp+' acertos',g.x,y+.9,g.z,info.bad?'bad':'');
  }
  for(const b of run.bolts){
   const arc=b.type==='bomb',height=arc?.6+Math.sin(Math.PI*b.t)*3.7:.68;
   const width=arc?.53:b.type==='shot'?.22:.31;
   const yaw=arc?0:Math.atan2(b.dx,b.dz);
   const length=arc?.58:b.type==='shot'?.63:1.13;
   const outline=b.type==='peloton'?0xeb650f:b.type==='mg'?0x138fbd:0xb640eb;
   instance(boltMeshes,outline,b.x,height,b.z,width*1.46,width*1.46,length*1.18,yaw);
   instance(boltMeshes,b.color,b.x,height+.05,b.z,width,width,length,yaw);
   instance(boltMeshes,0xfff6d8,b.x,height+.10,b.z,width*.45,width*.45,length*.59,yaw);
  }
  for(const p of debris){
   if(p.ring){
    const scale=3.9*(1-p.life/.5)+.5;
    instance(rings,p.color,p.x,.09,p.z,scale,1,scale);
    continue;
   }
   const size=p.flash?.69:Math.max(.08,p.life*.47);
   instance(p.flash?boltMeshes:dust,p.color,p.x,p.y,p.z,size,size,size);
  }
  let index=0;
  for(const n of numbers)tag('d'+index++,n.label,'',n.x,1.5+(1-n.life/.55)*2.2,n.z,'damage',{opacity:Math.min(1,n.life*5)});
  if(phase!=='menu')tag('army',run.army+' soldados',run.boost>0?'Cadência ×2 · '+Math.ceil(run.boost)+'s':'',heroX,2.72,BASE,'army');
  slots.forEach((s,i)=>{
   const tower=run.slots[i],visual=stationMeshes[i],btn=slotButtons[i];
   btn.hidden=phase!=='prep';btn.textContent=tower?'Nível '+tower.level:'Construir';btn.style.zIndex=1;
   if(!btn.hidden)position(btn,s.x,1.15,s.z);
   visual.turret.visible=!!tower;
   if(tower){
    visual.turret.rotation.y=-(tower.yaw??0);
    visual.body.material=material(towers[tower.type].color);
    visual.head.scale.x=tower.type==='shot'?.53:tower.type==='bomb'?.43:.27;
    visual.trim.scale.x=visual.head.scale.x+.06;
    visual.turret.scale.setScalar(1+(tower.level-1)*.15);
   }
  });
  for(const [id,node] of markerNodes)if(!node.seen){node.remove();markerNodes.delete(id);}
  cross.visible=phase==='wave';cross.position.set(run.aim.x,.077,run.aim.z);
  const boss=run.foes.find(e=>e.type==='boss'&&e.warning>0);
  warning.visible=!!boss;if(boss)warning.position.x=boss.attackX??0;warning.material.opacity=.5+.32*Math.sin(t*22);
  for(const mesh of meshes){
   if(!mesh.count)continue;
   mesh.instanceMatrix.needsUpdate=true;
   if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  }
  renderer.render(scene,camera);
 }
 return {draw};
}

let previous=0,accumulator=0,statsFrame=0;
function animation(now){
 const dt=previous?Math.min(.06,(now-previous)/1000):0;
 previous=now;
 if(phase==='wave'){
  if(freeze>0)freeze=Math.max(0,freeze-dt);
  else{
   accumulator+=dt*(slow>0?.39:1);
   while(accumulator>=STEP&&phase==='wave'){
    updateGame(STEP);accumulator-=STEP;
    if(freeze>0)break;
   }
  }
  slow=Math.max(0,slow-dt);
  savedClock+=dt;
  if(savedClock>2){savedClock=0;snapshot();}
 }else accumulator=0;
 if(phase!=='paused'){
  updateFx(dt);noteLeft=Math.max(0,noteLeft-dt);shake*=Math.exp(-dt*9);red=Math.max(0,red-dt);
 }
 statsFrame+=dt;
 if(statsFrame>.10){
  statsFrame=0;
  $('life').textContent='Base '+run.health+'%';
  $('hp').firstElementChild.style.width=run.health+'%';
  $('stage').textContent='Onda '+(run.wave+1)+' / '+TOTAL;
  const cooldown=Math.ceil(run.pulse??0);
  $('pulse').textContent=cooldown?'Pulso · '+cooldown+'s':'Pulso';
  $('pulse').disabled=cooldown>0;
  $('callout').hidden=noteLeft<=0||phase==='menu'||phase==='paused';
  $('callout').textContent=note;
 }
 $('game').style.setProperty('--damage',String(red*.9));
 rendering.draw();
 requestAnimationFrame(animation);
}
async function launch(){
 try{
  const T=await import('https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js');
  rendering=createScene(T);
  refresh();
  requestAnimationFrame(animation);
 }catch(error){
  console.error(error);
  panel('Não foi possível abrir o campo 3D','Abra em um navegador com WebGL 2 e confira sua conexão com a internet.',
   [button('Tentar novamente',()=>location.reload(),{primary:true})]);
 }
}
void launch();
</script>
